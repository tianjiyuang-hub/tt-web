<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ti4nj1.xyz</title>
    <style>
        :root {
            --bg:#0f172a;
            --card:#1e293b;
            --text:#e2e8f0;
            --subtext:#94a3b8;
            --border:#334155;
            --btn:#2563eb;
        }
        .light {
            --bg:#f8fafc;
            --card:#ffffff;
            --text:#1e293b;
            --subtext:#475569;
            --border:#cbd5e1;
            --btn:#2563eb;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            transition: background 0.35s, color 0.35s;
        }
        .top-bar{
            width:100%;
            max-width:520px;
            display:flex;
            justify-content: flex-end;
            margin-bottom:16px;
        }
        #themeBtn{
            padding:8px 14px;
            border-radius:8px;
            border:1px solid var(--border);
            background:var(--card);
            color:var(--text);
            cursor:pointer;
            font-size:14px;
        }
        .card {
            text-align: center;
            max-width: 520px;
            width: 100%;
            padding: 32px 24px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            border: 1px solid var(--border);
        }
        h1 {
            font-size: 2rem;
            margin-bottom:10px;
        }
        .domain {
            color:#60a5fa;
            font-size:1rem;
            margin-bottom:20px;
        }
        .desc{
            color:var(--subtext);
            margin-bottom:20px;
        }
        canvas{
            border:2px solid var(--border);
            border-radius:8px;
            background:#111;
        }
        .light canvas{
            background:#f1f5f9;
        }
        .game-info{
            margin:12px 0;
            font-size:15px;
            color:var(--subtext);
        }
        .ctrl button{
            padding:8px 16px;
            margin:4px;
            border-radius:6px;
            border:none;
            background:var(--btn);
            color:white;
            cursor:pointer;
        }
        footer {
            margin-top:24px;
            font-size:0.8rem;
            color:var(--subtext);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button id="themeBtn">☀️ 白天模式</button>
    </div>
    <div class="card">
        <h1>欢迎来到我的站点</h1>
        <div class="domain">ti4nj1.xyz</div>
        <p class="desc">贪吃蛇小游戏，方向键控制，按开始游戏</p>

        <canvas id="snake" width="400" height="400"></canvas>
        <div class="game-info">分数：<span id="score">0</span></div>
        <div class="ctrl">
            <button id="startBtn">开始游戏</button>
            <button id="resetBtn">重置</button>
        </div>
    </div>
    <footer>Powered by Cloudflare Pages</footer>

<script>
// 昼夜切换
const body=document.body;
const themeBtn=document.getElementById('themeBtn');
let isLight=false;
themeBtn.onclick=()=>{
    isLight=!isLight;
    body.classList.toggle('light',isLight);
    themeBtn.innerText= isLight?"🌙 夜晚模式":"☀️ 白天模式";
};

//贪吃蛇逻辑
const canvas=document.getElementById('snake');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const startBtn=document.getElementById('startBtn');
const resetBtn=document.getElementById('resetBtn');

const box=20;
let snake=[{x:8*box,y:8*box}];
let food={x:Math.floor(Math.random()*20)*box,y:Math.floor(Math.random()*20)*box};
let dir="RIGHT";
let nextDir="RIGHT";
let score=0;
let game=null;

function draw(){
    ctx.fillStyle= body.classList.contains('light')?"#f1f5f9":"#111111";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    //蛇
    ctx.fillStyle="#22c55e";
    for(let i=0;i<snake.length;i++){
        ctx.fillRect(snake[i].x,snake[i].y,box-1,box-1);
    }
    //食物
    ctx.fillStyle="#ef4444";
    ctx.fillRect(food.x,food.y,box-1,box-1);
}

function update(){
    dir=nextDir;
    let head={...snake[0]};
    if(dir==="LEFT") head.x-=box;
    if(dir==="RIGHT") head.x+=box;
    if(dir==="UP") head.y-=box;
    if(dir==="DOWN") head.y+=box;

    //撞墙
    if(head.x<0||head.x>=canvas.width||head.y<0||head.y>=canvas.height){
        clearInterval(game);
        alert("游戏结束！分数："+score);
        return;
    }
    //撞自己
    for(let i=1;i<snake.length;i++){
        if(head.x===snake[i].x&&head.y===snake[i].y){
            clearInterval(game);
            alert("游戏结束！分数："+score);
            return;
        }
    }

    snake.unshift(head);
    //吃到食物
    if(head.x===food.x&&head.y===food.y){
        score+=10;
        scoreEl.innerText=score;
        food={x:Math.floor(Math.random()*20)*box,y:Math.floor(Math.random()*20)*box};
    }else{
        snake.pop();
    }
    draw();
}

document.addEventListener("keydown",(e)=>{
    if(e.key==="ArrowLeft"&&dir!="RIGHT") nextDir="LEFT";
    if(e.key==="ArrowRight"&&dir!="LEFT") nextDir="RIGHT";
    if(e.key==="ArrowUp"&&dir!="DOWN") nextDir="UP";
    if(e.key==="ArrowDown"&&dir!="UP") nextDir="DOWN";
});

startBtn.onclick=()=>{
    if(game) return;
    game=setInterval(update,130);
};

resetBtn.onclick=()=>{
    clearInterval(game);
    game=null;
    snake=[{x:8*box,y:8*box}];
    dir="RIGHT";
    nextDir="RIGHT";
    score=0;
    scoreEl.innerText=0;
    food={x:Math.floor(Math.random()*20)*box,y:Math.floor(Math.random()*20)*box};
    draw();
};
draw();
</script>
</body>
</html>
