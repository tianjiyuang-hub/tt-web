<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ti4nj1.xyz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;

        h1 {
            font-size: 2.2rem;
            margin-bottom:12px;
            color:#ffffff;
        }
        .domain {
            color:#60a5fa;
            font-size:1.1rem;
            margin-bottom:28px;
        }
        p {
            color:#94a3b8;
            line-height:1.7;
            margin-bottom:32px;
        }
        .links a {
            display: inline-block;
            text-decoration: none;
            color:white;
            background:#2563eb;
            padding:12px 26px;
            border-radius: 8px;
            margin:6px;
            transition: 0.25s ease;
        }
        .links a:hover {
            background:#1d4ed8;
